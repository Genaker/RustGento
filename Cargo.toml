[package]
name = "gogento-rust"
edition = "2021"
version = "0.1.0"
publish = false

[workspace]
resolver = "2"
members = [
    "crates/entity",
    "crates/config",
    "crates/repository",
    "crates/import",
    "crates/api-rest",
    "crates/api-graphql",
    "crates/api-realtime",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["mysql", "runtime-tokio-rustls", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
thiserror = "2"
anyhow = "1"

entity = { path = "crates/entity" }
config = { path = "crates/config" }
repository = { path = "crates/repository" }
import = { path = "crates/import" }

[[bin]]
name = "gogento-import"
path = "bin/import_cli.rs"

[[bin]]
name = "gogento-server"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
clap = { version = "4", features = ["derive"] }
csv = "1"
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
entity.workspace = true
config.workspace = true
repository.workspace = true
import.workspace = true
anyhow.workspace = true
